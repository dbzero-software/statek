[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statek"
version = "0.1.9"
description = ""
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "build>=1.0.0",
    "dbzero>=0.3.3",
    "dbzero-modelkit==0.1.0",
    "easyoidc[nicegui]==0.1.12",
    "boto3==1.42.71",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "PyJWT==2.10.1",
    "httpx==0.28.1",
    "nest_asyncio==1.6.0",
    "nicegui==2.24.2",
    "markdown2==2.5.4",
    "weasyprint==68.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pylint>=3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/statek"
Repository = "https://github.com/yourusername/statek"

[tool.setuptools.packages.find]
where = ["."]
include = ["statek*"]
exclude = ["tests*", "experiments*"]

[tool.setuptools.package-data]
statek = ["*.json"]

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "C0302", "R0801", "R0902", "R0903"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
