[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statek"
version = "1.1.0"
description = "Durable Python workspaces for stateful LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Statek authors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dbzero-modelkit>=1.2.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "nest_asyncio==1.6.0",
    "RestrictedPython>=8.3",
]

[project.optional-dependencies]
dbzero = [
    "dbzero-modelkit[dbzero]>=1.2.0",
    "dbzero>=0.4.2",
]
dbzero-pro = [
    "dbzero-modelkit[dbzero-pro]>=1.2.0",
    "dbzero-pro>=0.3.3",
]
dev = [
    "dbzero>=0.4.2",
    "pytest>=7.0",
    "pytest-asyncio==1.3.0",
    "pylint>=3.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/dbzero-software/statek"
Repository = "https://github.com/dbzero-software/statek"
Documentation = "https://docs.dbzero.io/statek"

[tool.setuptools.packages.find]
where = ["."]
include = ["statek*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
statek = ["*.json"]

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "C0302", "R0801", "R0902", "R0903"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
