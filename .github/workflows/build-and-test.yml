name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        dbzero-runtime: ["dbzero", "dbzero-pro"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.1"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::874777259004:role/codeartifact-selltime-rw
        aws-region: eu-central-1

    - name: Configure CodeArtifact for uv
      run: |
        token=$(aws codeartifact get-authorization-token \
          --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
          --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
          --region eu-central-1 \
          --query authorizationToken --output text)
        endpoint=$(aws codeartifact get-repository-endpoint \
          --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
          --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
          --repository "${{ vars.CODEARTIFACT_REPO }}" \
          --format pypi \
          --region eu-central-1 \
          --query repositoryEndpoint --output text)
        echo "::add-mask::$token"
        echo "UV_DEFAULT_INDEX=https://aws:${token}@${endpoint#https://}simple/" >> "$GITHUB_ENV"
    
    - name: Install test dependencies
      run: |
        uv pip install --system pytest pytest-asyncio pylint twine
        uv pip install --system -e ".[${{ matrix.dbzero-runtime }}]"

    - name: Check dbzero runtime
      run: |
        python - <<'PY'
        import importlib.metadata
        import dbzero

        runtime = "${{ matrix.dbzero-runtime }}"
        installed = {dist.metadata["Name"].lower() for dist in importlib.metadata.distributions()}

        if runtime not in installed:
            raise SystemExit(f"{runtime} is not installed")

        print(f"Using {runtime}: {dbzero.__file__}")
        PY
    
    - name: Run linters
      run: |
        ./scripts/run_lint.sh
    
    - name: Build package
      run: |
        uv build --sdist --wheel
    
    - name: Install packages
      run: |
        uv pip install --system dist/*.whl
    
    - name: Run tests
      run: |
        pytest tests/ -v
