name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        dbzero-runtime: ["dbzero", "dbzero-pro"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::874777259004:role/codeartifact-selltime-rw
        aws-region: eu-central-1

    - name: Login to CodeArtifact for pip
      run: |
        aws codeartifact login \
          --tool pip \
          --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
          --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
          --repository "${{ vars.CODEARTIFACT_REPO }}" \
          --region eu-central-1
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest pytest-asyncio pylint twine
        pip install -e ".[${{ matrix.dbzero-runtime }}]"

    - name: Check dbzero runtime
      run: |
        python - <<'PY'
        import importlib.metadata
        import dbzero

        runtime = "${{ matrix.dbzero-runtime }}"
        installed = {dist.metadata["Name"].lower() for dist in importlib.metadata.distributions()}

        if runtime == "dbzero-pro" and "dbzero" in installed:
            raise SystemExit("dbzero must not be installed in the dbzero-pro CI lane")
        if runtime not in installed:
            raise SystemExit(f"{runtime} is not installed")

        print(f"Using {runtime}: {dbzero.__file__}")
        PY
    
    - name: Run linters
      run: |
        ./scripts/run_lint.sh
    
    - name: Build package
      run: |
        python -m build --sdist --wheel
        python -m build StatekWebUI --sdist --wheel
    
    - name: Install packages
      run: |
        pip install dist/*.whl
        pip install StatekWebUI/dist/*.whl
    
    - name: Run tests
      run: |
        pytest tests/ -v
