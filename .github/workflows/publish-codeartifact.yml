name: Publish to AWS CodeArtifact

on:
  push:
    tags:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build and publish tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::874777259004:role/codeartifact-selltime-rw
          aws-region: eu-central-1

      - name: Login to CodeArtifact
        run: |
          aws codeartifact login \
            --tool twine \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.AWS_ACCOUNT_ID }}" \
            --repository "${{ vars.CODEARTIFACT_REPO }}" \
            --region eu-central-1

      - name: Publish to CodeArtifact
        run: twine upload --repository codeartifact dist/*
