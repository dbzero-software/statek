name: Release Packages

on:
  workflow_dispatch:

jobs:
  publish-template:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/statek
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build template statek package
        run: |
          python -m build StatekTemplate --sdist --wheel

      - name: Publish template statek package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: StatekTemplate/dist/
